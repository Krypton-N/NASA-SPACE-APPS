<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Flame in Freefall</title>
    <meta name="description" content="Combustión en microgravedad: datos de NASA PSI, NTRS y Task Book, simulador de gota con evidencia y visualización 3D. NASA Space Apps 2026, reto #08." />
    <meta name="theme-color" content="#03050b" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap" />
  </head>
  <body>
    <canvas id="space" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <div class="shell">
      <header class="topbar wrap">
        <div class="topbar-inner">
          <a class="brand" href="#panorama" aria-label="Flame in Freefall, inicio">
            <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
              <defs>
                <radialGradient id="bm" cx="50%" cy="50%" r="50%">
                  <stop offset="55%" stop-color="#8fa9ff" stop-opacity="0" />
                  <stop offset="82%" stop-color="#8fa9ff" stop-opacity="0.95" />
                  <stop offset="100%" stop-color="#8fa9ff" stop-opacity="0" />
                </radialGradient>
              </defs>
              <circle cx="16" cy="16" r="15" fill="url(#bm)" />
              <circle cx="16" cy="16" r="10" fill="none" stroke="#ff9a4a" stroke-opacity="0.8" stroke-width="1.2" />
              <circle cx="16" cy="16" r="4" fill="#dfe5f2" />
            </svg>
            <span><span class="brand-name">Flame in Freefall</span><span class="brand-sub" style="display:block">Space Apps 2026 · #08</span></span>
          </a>
          <nav class="tabs" id="tabs" role="tablist" aria-label="Secciones"><span class="tab-pill" aria-hidden="true"></span></nav>
          <span class="countdown" id="countdown"></span>
        </div>
      </header>

      <main class="wrap" id="main">
        <section class="view" id="view-panorama" role="tabpanel" aria-labelledby="tab-panorama" hidden></section>
        <section class="view" id="view-explorador" role="tabpanel" aria-labelledby="tab-explorador" hidden></section>
        <section class="view" id="view-experimentos" role="tabpanel" aria-labelledby="tab-experimentos" hidden></section>
        <section class="view" id="view-simulador" role="tabpanel" aria-labelledby="tab-simulador" hidden></section>
        <section class="view" id="view-llama3d" role="tabpanel" aria-labelledby="tab-llama3d" hidden></section>
        <section class="view" id="view-evidencia" role="tabpanel" aria-labelledby="tab-evidencia" hidden></section>
        <section class="view" id="view-pipeline" role="tabpanel" aria-labelledby="tab-pipeline" hidden></section>
        <div class="msg-load dim" id="loading">Cargando datos de NASA…</div>

        <footer class="footer">
          <span>Datos: NASA Physical Sciences Informatics (CC0), NASA Technical Reports Server y NASA Task Book.</span>
          <span>Prototipo del equipo · NASA International Space Apps Challenge 2026</span>
        </footer>
      </main>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
